plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.txkj.drawingapp'
    compileSdk {
        version = release(35) //release(36) //(35) //
    }

    defaultConfig {
        applicationId "com.txkj.drawingapp"
        minSdk 21 //23 //24 //onyx need 24 //24//
        targetSdk 35//36 //35 //
        versionCode 16033
        versionName "1.60.33"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

/*
https://java.tutorialink.com/android-file-listfiles-returns-only-subdirectories/
My fault, I missed something. In Android 11, you can only access media files. In my case,
the files in external storage were not media files, so they were not displayed.
But after changing the target api to 29 (Android 10) everything works fine.
Thanks to everyone who tried to help!
 */
        //-----------------------
        //added for compiling

        //for jni so
        ndk {
            //https://www.cnblogs.com/zhangzhxb/p/14493600.html
            //xunfei need arm64
            //vosk require 'x86_64'
            //'armeabi-v7a',
            abiFilters "arm64-v8a", 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11 //don't use VERSION_8
        targetCompatibility JavaVersion.VERSION_11
    }

    //---------------
    //added for BuildConfig Not Found
    buildFeatures {
        buildConfig = true
    }

    //-----------------------
    //added for compiling

    //for dependencies
    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }

    //for jni so
    //https://www.jianshu.com/p/12e9077d3fe9
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    //onyx, added
    lintOptions {
        abortOnError false
    }
    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so'
        pickFirst 'androidsupportmultidexversion.txt'
    }
    //onyx, end added
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
//
////    implementation 'androidx.appcompat:appcompat:1.7.0'
//    implementation 'androidx.appcompat:appcompat:1.6.1'
//    implementation 'androidx.appcompat:appcompat:1.0.1'

//    implementation 'com.google.android.material:material:1.12.0'
//    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'

    testImplementation 'junit:junit:4.13.2'
//    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'androidx.annotation:annotation:1.0.0'

    implementation 'androidx.cardview:cardview:1.0.0'

    //xunfei
    implementation files('libs/SparkChain.aar')
    implementation files('libs/xxpermissions-8.2.aar')
    api 'com.google.code.gson:gson:2.8.8'

    //freepaint
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.takisoft.preferencex:preferencex:1.1.0'
    implementation 'dev.romainguy:pathway:0.18.0'

    //glide
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    //com.onyx.android.sdk:onyxsdk-device
    //***NOTE***, require minSdk 24
    //see
    // maven { url "https://jitpack.io" }
    // maven { url "http://repo.boox.com/repository/maven-public/" }
    //http://repo.boox.com/repository/proxy-public/
    //http://repo.boox.com/repository/maven-public/
    //boox, onyxsdk
    /*
    implementation('com.onyx.android.sdk:onyxsdk-device:1.2.28')
    implementation('com.onyx.android.sdk:onyxsdk-pen:1.3.8')
     */
    //see https://github.com/PatKreitzberg/hands-on-notes
    /*
